stages:
  - lint
  - test

default:
  image: rust:1.87
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-pip python3-venv
    - python3 -m venv .venv
    - .venv/bin/pip install --upgrade pip
    - rustup component add rustfmt clippy

rust_fmt:
  stage: lint
  script:
    - cargo fmt --all --check

rust_clippy:
  stage: lint
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

python_lint:
  stage: lint
  script:
    - .venv/bin/pip install ruff black
    - .venv/bin/ruff check python
    - .venv/bin/black --check python

rust_test:
  stage: test
  script:
    - cargo test --workspace --all-targets

python_test:
  stage: test
  script:
    - .venv/bin/pip install maturin pytest
    - .venv/bin/maturin develop
    - .venv/bin/python -c "from taskman_tui.client import TaskmanClient; c=TaskmanClient(); s=c.fetch_snapshot(); print('processes', len(s['processes']))"
    - |
      set +e
      .venv/bin/pytest -q
      status=$?
      set -e
      if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
        exit "$status"
      fi
