[workspace]
members = [
    "crates/taskman-domain",
    "crates/taskman-engine",
    "crates/taskman-platform-linux",
    "crates/taskman-platform-windows",
    "crates/taskman-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Taskman Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
sysinfo = "0.33"
nix = { version = "0.30", features = ["signal", "sched"] }
libc = "0.2"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
